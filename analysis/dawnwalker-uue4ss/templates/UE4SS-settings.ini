; cyberfox1337x.function("dawnwalker_inert_smoke_settings")
; Inert first-run smoke template for official UE4SS zDEV.
; Every optional/action mod and every UE4SS hook remains off. This profile only proves clean loader startup/logging.

[Overrides]
ModsFolderPath =
ControllingModsTxt =

[General]
EnableHotReloadSystem = 0
HotReloadKey = R
EnableAutoReloadingLuaMods = 0
UseCache = 0
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 120
bUseUObjectArrayCache = false
bForceGUObjectArrayForIteration = true
DoEarlyScan = 0
bEnableSeachByMemoryAddress = false
DefaultExecuteInGameThreadMethod = EngineTick
DefaultFNameToStringMethod = Scan

[EngineVersionOverride]
MajorVersion = 5
MinorVersion = 5
DebugBuild = false

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0
UseModuleOffsets = 1

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 1
KeepMemoryLayout = 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[UHTHeaderGenerator]
IgnoreAllCoreEngineModules = 0
IgnoreEngineAndCoreUObject = 0
MakeAllFunctionsBlueprintCallable = 0
MakeAllPropertyBlueprintsReadWrite = 0
MakeEnumClassesBlueprintType = 0
MakeAllConfigsEngineConfig = 0

[SDKGenerator]
OutputPath =

[Debug]
ConsoleEnabled = 1
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
GuiConsoleFontScaling = 1
GuiConsoleMonospaceTextEditors = 0
GraphicsAPI = opengl
RenderMode = ExternalThread
ToggleGuiKey = O

[Threads]
SigScannerNumThreads = 8
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 70

[Hooks]
HookProcessInternal = 0
HookProcessLocalScriptFunction = 0
HookInitGameState = 0
HookLoadMap = 0
HookCallFunctionByNameWithArguments = 0
HookBeginPlay = 0
HookEndPlay = 0
HookLocalPlayerExec = 0
HookAActorTick = 0
HookEngineTick = 0
EngineTickResolveMethod = Scan
HookGameViewportClientTick = 0
HookUObjectProcessEvent = 0
HookProcessConsoleExec = 0
HookUStructLink = 0
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
EnableDumping = 0
FullMemoryDump = 0

[ExperimentalFeatures]
